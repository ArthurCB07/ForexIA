# Evolution API local para FOREX IA
# Uso:
#   docker compose -f docker-compose.evolution.yml up -d
# Depois abra o FOREX IA > Instalação > WhatsApp Evolution API.
# URL: http://localhost:8080
# API Key global: forex-ia-123456

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: forex_ia_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=forex-ia-123456
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=FOREX IA
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=10
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
